# 05 — Variables prédéfinies et variables secrètes.
#
# Avant de lancer : Edit > Variables > New variable
#   nom motDePasseSql, valeur au choix, cocher « Keep this value secret ».
# Un secret n'est JAMAIS exporté automatiquement en variable d'environnement :
# il faut le mapper explicitement avec env:. Il est masqué (***) dans les journaux.

trigger: none

pool:
  vmImage: ubuntu-24.04

steps:
  - script: |
      echo "Run         : $(Build.BuildNumber) (id $(Build.BuildId))"
      echo "Pipeline    : $(Build.DefinitionName)"
      echo "Branche     : $(Build.SourceBranch) ($(Build.SourceBranchName))"
      echo "Commit      : $(Build.SourceVersion)"
      echo "Raison      : $(Build.Reason) par $(Build.RequestedFor)"
      echo "Dépôt       : $(Build.Repository.Name)"
      echo "Agent       : $(Agent.Name) - $(Agent.OS)"
      echo "Espace      : $(Pipeline.Workspace)"
      echo "Sources     : $(Build.SourcesDirectory)"
      echo "Staging     : $(Build.ArtifactStagingDirectory)"
    displayName: Variables prédéfinies utiles

  - bash: |
      echo "Sans mapping, la variable d'environnement est vide : [${MOTDEPASSESQL:-}]"
    displayName: Le secret n'est pas exporté tout seul

  - bash: |
      echo "Avec mapping, le secret est disponible : longueur ${#MOT_DE_PASSE_SQL} caractères"
      echo "Et s'il est affiché par erreur, il est masqué : $MOT_DE_PASSE_SQL"
    displayName: Mapper le secret explicitement
    env:
      MOT_DE_PASSE_SQL: $(motDePasseSql)
