trigger:
- master

parameters:
- name: configuration
  displayName: Configuration de compilation
  type: string
  default: Debug
  values:
  - Release
  - Debug

pool:
  vmImage: ubuntu-24.04

variables:
  buildConfiguration: ${{ parameters.configuration }}
  feedName: 'RDV-Ihab/feed'
  packageVersion: '1.0.$(Build.BuildId)'
  packagesDir: '$(Build.ArtifactStagingDirectory)/packages'
  appDir: '$(Build.ArtifactStagingDirectory)/app'

stages:
- stage: BuildAndTest
  variables:
    projetsTests: '**/dotnetcore-tests/*.csproj'
  jobs:
  - job: BuildAndTestJob
    variables:
      titreTests: 'dotnet test $(buildConfiguration) - $(Build.BuildNumber)'
    steps:
    - script: |
        echo "buildConfiguration = $(buildConfiguration)"
        echo "projetsTests       = $(projetsTests)"
        echo "titreTests         = $(titreTests)"
        echo "packageVersion     = $(packageVersion)"
      displayName: Afficher les variables

    - task: DotNetCoreCLI@2
      displayName: 'Build .NET Core project'
      inputs:
        command: build
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Test .NET Core project'
      inputs:
        command: test
        projects: '$(projetsTests)'
        arguments: '--configuration $(buildConfiguration) --no-build'
        testRunTitle: '$(titreTests)'

    - task: DotNetCoreCLI@2
      displayName: 'Build a package'
      inputs:
        command: pack
        packagesToPack: '**/*.csproj;!**/dotnetcore-tests/*.csproj'
        configuration: '$(buildConfiguration)'
        nobuild: true
        versioningScheme: byEnvVar
        versionEnvVar: packageVersion
        packDirectory: '$(packagesDir)'

    - script: ls -l $(packagesDir)
      displayName: Lister les packages

    - task: DotNetCoreCLI@2
      displayName: Push vers Azure Artifacts
      condition: succeeded()
      inputs:
        command: push
        packagesToPush: '$(packagesDir)/*.nupkg'
        nuGetFeedType: internal
        publishVstsFeed: '$(feedName)'

    - ${{ if eq(parameters.configuration, 'Release') }}:
      - task: DotNetCoreCLI@2
        displayName: Publier l'application
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          command: publish
          publishWebProjects: false
          projects: |
            **/*.csproj
            !**/dotnetcore-tests/*.csproj
          arguments: '--configuration $(buildConfiguration) --output $(appDir)'
          zipAfterPublish: true

      - task: PublishPipelineArtifact@1
        displayName: Publier l'artefact
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          targetPath: '$(appDir)'
          artifact: app

- stage: Rapport
  condition: always()
  jobs:
  - job: Resume
    steps:
    - script: |
        echo 'buildConfiguration = $(buildConfiguration)'
        echo 'projetsTests       = $(projetsTests)'
        echo 'titreTests         = $(titreTests)'
        echo 'aDesTests          = $(aDesTests)'
      displayName: Ce que voit un autre stage